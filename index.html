<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>San Parrilla | Restaurante y Comidas Rápidas</title>
  <meta http-equiv="refresh" content="0; url=https://san-parrilla-app.vercel.app/">
  <link rel="canonical" href="https://san-parrilla-app.vercel.app/">
  <script>
    (function() {
      var targetBase = "https://san-parrilla-app.vercel.app";
      var path = window.location.pathname || "/";
      var search = window.location.search || "";
      var hash = window.location.hash || "";
      var fullUrl = targetBase + path + search + hash;
      window.location.replace(fullUrl);
    })();
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: #150905;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .card {
      background: #1f0f09;
      border: 1px solid #451a03;
      padding: 2.5rem 2rem;
      border-radius: 1.25rem;
      max-width: 420px;
      margin: 1rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.25rem;
      display: block;
    }
    h1 {
      font-size: 1.35rem;
      margin: 0 0 0.5rem;
      color: #f59e0b;
    }
    p {
      font-size: 0.9rem;
      color: #d1d5db;
      margin: 0 0 1.5rem;
      line-height: 1.4;
    }
    .btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: #d97706;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      border-radius: 0.75rem;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #b45309;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="logo.png" alt="San Parrilla" class="logo" onerror="this.style.display='none'">
    <h1>Cargando San Parrilla...</h1>
    <p>Te estamos redirigiendo a nuestra nueva plataforma digital con pedidos y menú en tiempo real.</p>
    <a href="https://san-parrilla-app.vercel.app/" class="btn" id="manual-link">Entrar a San Parrilla →</a>
  </div>
  <script>
    document.getElementById('manual-link').href = "https://san-parrilla-app.vercel.app" + (window.location.pathname || "/") + (window.location.search || "") + (window.location.hash || "");
  </script>
</body>
</html>
